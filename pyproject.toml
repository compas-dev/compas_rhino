[build-system]
requires = ["setuptools>=66", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compas_rhino"
version = "2.15.0"
description = "Rhino integration for the COMPAS framework"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [{name = "COMPAS Association"}]
keywords = ["compas", "architecture", "engineering", "rhino"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = ["compas>=2.15,<3"]

[project.optional-dependencies]
dev = ["build", "invoke", "pytest", "ruff", "twine"]
docs = ["mkdocs>=1.6,<2"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["compas_rhino", "compas_rhino.*"]
namespaces = false

[tool.setuptools.package-data]
"compas_rhino" = ["**/*.png", "**/*.json", "**/*.yml", "components/*/*.py", "components_cpython/*/*.py", "**/*.ghuser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--tb=short"]

[tool.ruff]
line-length = 179
target-version = "py312"
# The recovered sources are intentionally unchanged; expand lint coverage during migration.
include = ["tasks.py", "tests/**/*.py", "scripts/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
force-single-line = true
